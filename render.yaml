services:
  - type: web
    name: todo-api
    runtime: node
    plan: free
    region: virginia
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGIN
        value: https://abhiraj-todo-mern.netlify.app
